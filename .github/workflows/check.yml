name: Source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Check tracked source
        run: python3 scripts/check-repository.py
      - name: Install isolated test compiler
        run: npm install --prefix "$RUNNER_TEMP/qinglu-test-deps" --no-package-lock --ignore-scripts typescript@4.9.5
      - name: Run tests
        env:
          RECORDER_TYPESCRIPT_DIR: ${{ runner.temp }}/qinglu-test-deps/node_modules/typescript
        run: bash scripts/test.sh
