name: Build unsigned HAP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, macOS, deveco]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check tracked source
        run: python3 scripts/check-repository.py
      - name: Build isolated release assets with local DevEco SDK
        run: python3 scripts/package-release.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qinglu-release-assets
          path: artifacts/release-*/*
          if-no-files-found: error
          retention-days: 7
