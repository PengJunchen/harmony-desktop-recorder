name: Build unsigned HAP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, macOS, deveco]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check tracked source
        run: python3 scripts/check-repository.py
      - name: Build with local DevEco SDK
        run: bash scripts/build.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qinglu-unsigned-hap
          path: entry/build/default/outputs/default/entry-default-unsigned.hap
          if-no-files-found: error
          retention-days: 7
